# HUBRIS local infrastructure.
# Usage: docker compose up -d postgres
# Host port is 5433: a native Windows PostgreSQL service already occupies 5432
# on this machine, and it is left untouched.
# App connection string: DATABASE_URL=postgresql://hubris:hubris@localhost:5433/hubris
# Credentials below are local-dev only. Override with environment for anything shared.

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: hubris
      POSTGRES_USER: hubris
      POSTGRES_PASSWORD: hubris
    ports:
      - "5433:5432"
    volumes:
      - hubris-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hubris -d hubris"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  hubris-pgdata:
