name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hubris
          POSTGRES_USER: hubris
          POSTGRES_PASSWORD: hubris
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://hubris:hubris@localhost:5432/hubris
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hubris/db migrate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
